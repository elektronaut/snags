name: CI
on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
  pull_request:
    paths-ignore:
      - "*.md"
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked
      - uses: taiki-e/install-action@v2.90.6
        with:
          tool: cargo-nextest@0.9.146
      # Each test runs in its own process; .config/nextest.toml fails one
      # that runs for three minutes, and the rest still run.
      - run: cargo nextest run --locked --profile ci

  # The `rust-version` in Cargo.toml, which `cargo install` checks.
  msrv:
    name: Build on the MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Read rust-version
        run: echo "MSRV=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

  # A new advisory shouldn't fail unrelated pull requests, so the advisories
  # check reports without failing the run.
  deny:
    name: Dependencies (${{ matrix.checks }})
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: EmbarkStudios/cargo-deny-action@v2.1.3
        with:
          command: check ${{ matrix.checks }}
