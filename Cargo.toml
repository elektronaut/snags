[package]
name = "snags"
version = "0.1.0"
description = "A local log where coding agents record what slowed them down, look up known problems, and close them once fixed"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/elektronaut/snags"
homepage = "https://github.com/elektronaut/snags"
keywords = ["cli", "agents", "papercuts", "sqlite", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
regex = "1.13"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
